# Keeps the GitHub Actions used by the workflows (actions/checkout...) up to
# date: Dependabot opens a pull request, and CI runs on it like on any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
